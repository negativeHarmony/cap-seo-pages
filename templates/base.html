<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ url }}">
    {% if google_verification %}
  <meta name="google-site-verification" content="{{ google_verification }}">
  {% endif %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ url }}">
  <style>
    :root { --ink: #14181F; --paper: #FAF8F4; --accent: #7A5A1E; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.6 Georgia, serif; }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    header a { color: var(--ink); font-weight: bold; text-decoration: none; }
    h1 { font-size: 2rem; line-height: 1.2; }
    a { color: var(--accent); }
    .cta { display: inline-block; background: var(--ink); color: #FFFFFF; padding: 12px 20px;
           border-radius: 6px; text-decoration: none; }
    footer { font-size: 0.9rem; color: #555555; }
  </style>
</head>
<body>
  <header><a href="{{ home_url }}">{{ site_name }}</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>&copy; {{ year }} {{ site_name }}</footer>
</body>
</html>
